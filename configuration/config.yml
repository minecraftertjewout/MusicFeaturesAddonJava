  musicaddon:disc_press:
    material: paper
    custom-model-data: 3000
    data:
      item-name: "<!i>Disc Press"
    model:
      type: minecraft:model
      path: musicaddon:block/disc_press
    behavior:
      type: block_item
      block: musicaddon:disc_press
blocks:
  musicaddon:disc_press:
    state:
      auto_state: cactus
      model:
        path: musicaddon:block/disc_press
    settings:
      item: musicaddon:disc_press
      is_suffocating: false
      is_redstone_conductor: false
      is_view_blocking: false
    events:
      right_click:
        - type: if_else
          rules:
            - conditions:
                - type: hand
                  hand: main_hand
                - type: match_item
                  id: musicaddon:empty_disc
              functions:
                - type: command
                  command: "discpress open <arg:player.name>"
            - conditions:
                - type: hand
                  hand: main_hand
              functions:
                - type: message
                  message: "Hold an empty disc to burn it."
                  overlay: true
