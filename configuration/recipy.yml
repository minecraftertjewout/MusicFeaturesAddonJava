recipes:
  musicaddon:empty_disc:
    type: shaped
    category: misc
    pattern:
      - " G "
      - "GPG"
      - " G "
    ingredients:
      P: "minecraft:paper"
      G: "minecraft:glass_pane"
    result:
      id: musicaddon:empty_disc
      count: 1
  musicaddon:disc_press:
    type: shaped
    category: misc
    pattern:
      - "CDC"
      - "CTC"
      - "SSS"
    ingredients:
      C: "minecraft:copper_ingot"
      D: "musicaddon:empty_disc"
      T: "minecraft:crafting_table"
      S: "minecraft:cobblestone"
    result:
      id: musicaddon:disc_press
      count: 1
  musicaddon:pocket_jukebox:
    type: shaped
    category: misc
    pattern:
